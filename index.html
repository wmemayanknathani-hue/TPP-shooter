<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRONFALL - Third Person Shooter</title>
<style>
:root{--bg:#0b0e12;--fg:#e9eef5;--ac:#ffb020;--red:#ff3b3b;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;opacity:.9}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{left:11px;top:0;width:2px;height:24px;-webkit-mask:linear-gradient(#000 38%,transparent 38% 62%,#000 62%)}
#cross:after{top:11px;left:0;height:2px;width:24px;-webkit-mask:linear-gradient(90deg,#000 38%,transparent 38% 62%,#000 62%)}
#hm{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border:2px solid var(--red);transform:rotate(45deg);opacity:0}
#dmg{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(255,0,0,.8);opacity:0}
#bl{position:absolute;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:260px}
#br{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:right}
#tr{position:absolute;right:24px;top:calc(18px + env(safe-area-inset-top,0px));text-align:right;font-weight:700;letter-spacing:.08em}
.lbl{font-size:12px;letter-spacing:.2em;opacity:.7}
.bar{height:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);margin-top:4px}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#d62d2d,#ff8a3b)}
#ammo{font-size:44px;font-weight:800;line-height:1}
#ammo small{font-size:18px;opacity:.7}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:44px;font-weight:800;letter-spacing:.3em;color:var(--ac);text-shadow:0 0 20px #000;opacity:0;transition:opacity .5s}
#ov{position:fixed;inset:0;background:radial-gradient(circle,rgba(10,14,20,.7),rgba(5,7,10,.95));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:20px}
#ov h1{font-size:clamp(40px,9vw,92px);margin:0;letter-spacing:.25em;color:var(--ac)}
#ov p{max-width:560px;line-height:1.7;opacity:.85}
kbd{background:#222a33;border:1px solid #445;border-radius:4px;padding:1px 7px;font-size:.9em}
.btn{margin-top:18px;padding:14px 38px;background:var(--ac);color:#111;font-weight:800;letter-spacing:.2em;border-radius:3px}
</style></head><body>
<div id="hud">
 <div id="dmg"></div><div id="cross"></div><div id="hm"></div><div id="banner"></div>
 <div id="tr"><div>SCORE <span id="sc">0</span></div><div class="lbl">WAVE <span id="wv">0</span> &middot; HOSTILES <span id="en">0</span></div></div>
 <div id="bl"><div class="lbl">HEALTH</div><div class="bar"><div id="hp"></div></div></div>
 <div id="br"><div class="lbl" id="wl">ASSAULT RIFLE</div><div id="ammo">30<small> / 120</small></div></div>
</div>
<div id="ov"><h1>IRONFALL</h1>
 <p>Survive endless waves of hostile soldiers. Headshots deal massive damage. Each cleared wave restores health and ammo.</p>
 <p><kbd>W A S D</kbd> move &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Space</kbd> jump<br><kbd>Mouse</kbd> aim &nbsp; <kbd>Click</kbd> fire (hold) &nbsp; <kbd>R</kbd> reload</p>
 <div class="btn" id="btn">CLICK TO DEPLOY</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=THREE,rand=Math.random;
const scene=new R.Scene();scene.background=new R.Color(0x9fb4c8);scene.fog=new R.Fog(0x9fb4c8,30,130);
const renderer=new R.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=R.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const cam=new R.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);cam.rotation.order='YXZ';
scene.add(new R.HemisphereLight(0xdfeaff,0x445544,.75));
const sun=new R.DirectionalLight(0xfff0d0,1.1);sun.position.set(40,70,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc_=sun.shadow.camera;sc_.left=sc_.bottom=-70;sc_.right=sc_.top=70;sc_.far=200;scene.add(sun);
// ground
const cv=document.createElement('canvas');cv.width=cv.height=256;const cx=cv.getContext('2d');
cx.fillStyle='#3b4148';cx.fillRect(0,0,256,256);
for(let i=0;i<1800;i++){cx.fillStyle=`rgba(${rand()<.5?255:0},${rand()<.5?255:0},${rand()<.5?255:0},.04)`;cx.fillRect(rand()*256,rand()*256,3,3)}
cx.strokeStyle='#2a3036';cx.lineWidth=4;cx.strokeRect(0,0,256,256);
const tex=new R.CanvasTexture(cv);tex.wrapS=tex.wrapT=R.RepeatWrapping;tex.repeat.set(30,30);tex.anisotropy=4;
const ground=new R.Mesh(new R.PlaneGeometry(200,200),new R.MeshStandardMaterial({map:tex,roughness:.95}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// obstacles
const boxes=[],ob=[];
function addBox(x,z,w,h,d,col,neon){const m=new R.Mesh(new R.BoxGeometry(w,h,d),new R.MeshStandardMaterial({color:col,roughness:.75,metalness:.25}));
 m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);boxes.push({x,z,w:w/2,d:d/2});ob.push(m);
 if(neon){const n=new R.Mesh(new R.BoxGeometry(w+.1,.12,d+.1),new R.MeshBasicMaterial({color:neon}));n.position.set(x,h-.2,z);scene.add(n)}}
let seed=7;const sr=()=>(seed=seed*16807%2147483647)/2147483647;
const pal=[0x5b6470,0x6d5a4b,0x46515c,0x7a6a58,0x3f4a3f];
for(let i=0;i<30;i++){const x=(sr()-.5)*112,z=(sr()-.5)*112;if(Math.hypot(x,z)<9)continue;
 const tall=sr()<.35;addBox(x,z,2+sr()*5,tall?5+sr()*8:1.2+sr()*1.4,2+sr()*5,pal[i%5],tall?(i%2?0x00e5ff:0xff3b8a):0)}
[[0,-63,130,6,2],[0,63,130,6,2],[-63,0,2,6,130],[63,0,2,6,130]].forEach(a=>addBox(a[0],a[1],a[2],a[3],a[4],0x20252b,0xffb020));
function push(p,r){for(const b of boxes){const qx=Math.max(b.x-b.w,Math.min(p.x,b.x+b.w)),qz=Math.max(b.z-b.d,Math.min(p.z,b.z+b.d));
 const dx=p.x-qx,dz=p.z-qz,dd=dx*dx+dz*dz;if(dd<r*r){if(dd>1e-6){const l=Math.sqrt(dd);p.x=qx+dx/l*r;p.z=qz+dz/l*r}else p.x+=r}}}
// characters
function human(col,acc){const g=new R.Group();const mat=c=>new R.MeshStandardMaterial({color:c,roughness:.7});
 const part=(w,h,d,x,y,z,c,par)=>{const m=new R.Mesh(new R.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;(par||g).add(m);return m};
 part(.6,.7,.35,0,1.25,0,col);part(.5,.3,.38,0,1.0,0,0x22262b);g.head=part(.3,.3,.3,0,1.78,0,0xd9b48f);part(.36,.14,.36,0,1.93,0,acc);
 const leg=x=>{const l=new R.Group();l.position.set(x,.8,0);g.add(l);part(.22,.8,.25,0,-.4,0,0x2a2f36,l);return l};
 g.lL=leg(-.15);g.lR=leg(.15);part(.15,.55,.15,-.4,1.3,0,col);part(.15,.5,.15,.32,1.3,-.25,col);part(.12,.14,.9,.3,1.3,-.6,0x111);
 return g}
function ownerize(g,o){g.traverse(m=>{m.userData.owner=o});g.head.userData.head=true}
function anim(g,ph,a){g.lL.rotation.x=Math.sin(ph)*a;g.lR.rotation.x=-Math.sin(ph)*a}
// state
const P={pos:new R.Vector3(0,0,8),vy:0,hp:100,ammo:30,res:120,rl:0,cd:0,ph:0,g:human(0x3d6b8f,0xffb020)};scene.add(P.g);
let yaw=0,pitch=-.1,kick=0,score=0,wave=0,started=false,over=false,fire=false,wavePending=false,dmgA=0,hmA=0,flash=0;
const keys={},enemies=[];
const mflash=new R.PointLight(0xffc060,0,12);scene.add(mflash);
// sound
let ac;function snd(f,d,v,t){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t||'sawtooth';
 o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(40,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ac.destination);o.start();o.stop(n+d)}
// fx
const fx=[],sparkG=new R.BoxGeometry(.07,.07,.07);
function burst(p,col,n){for(let i=0;i<n;i++){const m=new R.Mesh(sparkG,new R.MeshBasicMaterial({color:col,transparent:true}));m.position.copy(p);
 m.v=new R.Vector3(rand()-.5,rand()*.8,rand()-.5).multiplyScalar(7);m.life=.5;scene.add(m);fx.push(m)}}
const tgeo=new R.BoxGeometry(.04,.04,1);
function tracer(a,b,col){const m=new R.Mesh(tgeo,new R.MeshBasicMaterial({color:col,transparent:true}));const l=a.distanceTo(b);
 m.position.copy(a).lerp(b,.5);m.lookAt(b);m.scale.z=l;m.life=.07;m.tr=1;scene.add(m);fx.push(m)}
// enemies
function spawn(){const g=human(0x8a3030,0x222);const a=rand()*Math.PI*2,r=40+rand()*14;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
 const e={g,hp:100,cd:1+rand()*2,s:rand()<.5?1:-1,ph:rand()*6,dead:false,t:0,sp:2.8+rand()*1.2+wave*.1};ownerize(g,e);scene.add(g);enemies.push(e)}
function banner(t){const b=$('banner');b.textContent=t;b.style.opacity=1;setTimeout(()=>b.style.opacity=0,2200)}
function nextWave(){wave++;wavePending=false;banner('WAVE '+wave);if(wave>1){P.hp=Math.min(100,P.hp+30);P.res+=60}
 const n=Math.min(4+wave*2,26);for(let i=0;i<n;i++)setTimeout(spawn,i*350)}
function hurt(d){P.hp-=d;dmgA=1;snd(90,.2,.25,'sawtooth');if(P.hp<=0&&!over){over=true;document.exitPointerLock&&document.exitPointerLock();
 $('ov').style.display='flex';$('ov').querySelector('h1').textContent='KIA';$('ov').querySelectorAll('p')[0].textContent='You reached wave '+wave+' with a score of '+score+'.';
 $('ov').querySelectorAll('p')[1].textContent='';$('btn').textContent='CLICK TO RETRY'}}
// shooting
const rc=new R.Raycaster(),v2=new R.Vector2();
function reload(){if(P.rl>0||P.ammo>=30||P.res<=0)return;P.rl=1.5;$('wl').textContent='RELOADING...';snd(300,.15,.1,'square')}
function shoot(){if(P.rl>0||P.cd>0)return;if(P.ammo<=0){reload();return}
 P.ammo--;P.cd=.1;cam.updateMatrixWorld();const sp=(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD)?.012:.003;
 v2.set((rand()-.5)*sp,(rand()-.5)*sp);rc.setFromCamera(v2,cam);rc.near=3.3;rc.far=150;
 const list=ob.concat(enemies.filter(e=>!e.dead).map(e=>e.g),[ground]);const h=rc.intersectObjects(list,true)[0];
 const pt=h?h.point:rc.ray.at(150,new R.Vector3());P.g.updateMatrixWorld(true);
 tracer(P.g.localToWorld(new R.Vector3(.3,1.3,-1)),pt,0xffe08a);
 if(h){const e=h.object.userData.owner;if(e){const hs=h.object.userData.head;e.hp-=hs?100:30;burst(h.point,0xff3030,8);hmA=1;
  $('hm').style.borderColor=hs?'#ffb020':'#ff3b3b';
  if(e.hp<=0){e.dead=true;score+=hs?150:100;snd(160,.25,.15,'triangle')}}else burst(h.point,0xffd080,5)}
 flash=.05;kick+=.012;snd(240,.1,.12,'square')}
// input
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='Space'&&P.pos.y<=0.01&&started)P.vy=8.5});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(!started||over)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.1,Math.min(.8,pitch-e.movementY*.0022))});
addEventListener('mousedown',e=>{if(started&&!over){fire=true;if(!document.pointerLockElement)try{renderer.domElement.requestPointerLock()}catch(_){}}});
addEventListener('mouseup',()=>fire=false);
$('ov').addEventListener('click',()=>{if(over){location.reload();return}try{renderer.domElement.requestPointerLock()}catch(_){}
 ac=ac||new(window.AudioContext||window.webkitAudioContext)();$('ov').style.display='none';if(!started){started=true;nextWave()}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// loop
const clock=new R.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
 if(started&&!over){
  let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iz=(keys.KeyS?1:0)-(keys.KeyW?1:0),mv=ix||iz;
  if(mv){const l=Math.hypot(ix,iz);ix/=l;iz/=l;const sp=keys.ShiftLeft?9:5.5;
   P.pos.x+=(Math.cos(yaw)*ix-Math.sin(yaw)*-iz)*sp*dt;P.pos.z+=(-Math.sin(yaw)*ix-Math.cos(yaw)*-iz)*sp*dt;P.ph+=dt*(keys.ShiftLeft?14:10)}
  P.vy-=22*dt;P.pos.y=Math.max(0,P.pos.y+P.vy*dt);if(P.pos.y===0)P.vy=0;push(P.pos,.45);
  P.pos.x=Math.max(-60,Math.min(60,P.pos.x));P.pos.z=Math.max(-60,Math.min(60,P.pos.z));
  P.g.position.copy(P.pos);P.g.rotation.y=yaw;anim(P.g,P.ph,mv?.7:0);
  P.cd-=dt;if(P.rl>0){P.rl-=dt;if(P.rl<=0){const n=Math.min(30-P.ammo,P.res);P.ammo+=n;P.res-=n;$('wl').textContent='ASSAULT RIFLE'}}
  if(fire)shoot();kick*=Math.pow(.02,dt);
  // enemies
  for(const e of enemies){if(e.dead){e.t+=dt;e.g.rotation.x=-Math.min(e.t*4,1.5);if(e.t>1.8&&e.g.parent)scene.remove(e.g);continue}
   const p=e.g.position,dx=P.pos.x-p.x,dz=P.pos.z-p.z,d=Math.hypot(dx,dz)||1;e.g.rotation.y=Math.atan2(-dx,-dz);
   const m=d>16?1:d<9?-1:0;p.x+=(dx/d*m-dz/d*e.s*.5)*e.sp*dt;p.z+=(dz/d*m+dx/d*e.s*.5)*e.sp*dt;push(p,.5);
   e.ph+=dt*8;anim(e.g,e.ph,.6);if(rand()<dt*.3)e.s=-e.s;e.cd-=dt;
   if(d<45&&e.cd<=0){e.cd=1+rand()*1.3;const a=new R.Vector3(p.x,1.4,p.z),b=new R.Vector3(P.pos.x+(rand()-.5),P.pos.y+1.3+(rand()-.5),P.pos.z+(rand()-.5));
    tracer(a,b,0xff4040);snd(150,.1,.05,'square');if(rand()<.3)hurt(5+wave*.6)}}
  const alive=enemies.filter(e=>!e.dead).length;$('en').textContent=alive;
  if(!alive&&!wavePending&&wave>0){wavePending=true;setTimeout(()=>{if(!over)nextWave()},3000)}
 }
 // camera
 cam.rotation.set(pitch+kick,yaw,0);cam.updateMatrixWorld();
 cam.position.set(P.pos.x,P.pos.y+1.6,P.pos.z).add(new R.Vector3(.9,.35,3.4).applyQuaternion(cam.quaternion));cam.position.y=Math.max(.3,cam.position.y);
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;
  if(f.tr)f.material.opacity=f.life/.07;else{f.v.y-=18*dt;f.position.addScaledVector(f.v,dt);f.material.opacity=f.life*2}
  if(f.life<=0){scene.remove(f);f.material.dispose();fx.splice(i,1)}}
 flash-=dt;mflash.intensity=flash>0?3:0;P.g.updateMatrixWorld(true);mflash.position.copy(P.g.localToWorld(new R.Vector3(.3,1.4,-1.2)));
 dmgA=Math.max(0,dmgA-dt*1.5);hmA=Math.max(0,hmA-dt*6);$('dmg').style.opacity=dmgA;$('hm').style.opacity=hmA;
 $('hp').style.width=Math.max(0,P.hp)+'%';$('ammo').innerHTML=P.ammo+'<small> / '+P.res+'</small>';$('sc').textContent=score;$('wv').textContent=wave;
 renderer.render(scene,cam)}
loop();
</script></body></html>
